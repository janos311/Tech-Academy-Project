<!DOCTYPE html>
<html>
    <head>
        <title>My One-Pahe Website</title>
        <meta charset="UTF-8">
    </head>
    <body>
       
        <!--NAVIGATION-->
        <nav>
            <a href="#home">Home</a>
            <a href="#pets">Pets</a>
            <a href="#contact">Contact</a>
            <a href="#video">Video</a>
        </nav>

        <!--HOME-->
        <section id="home">
            <h1>Welcome to MY One-Page Website</h1>
            <p>Welcome to my website!</p>
        </section>

        <!--PETS--> 
        <section id="pets">
            <h2>My Favorite Pets</h2>

            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131" alt="Cute cat">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d" alt="Cute dog">
        </section>

        <!--CONTACT-->
        <section id="contact">
            <h2>Contact Me</h2>

            <form>
                <lable for="name">Name:</lable><br>
                <input type="text" id="name" name="name"><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message"></textarea><br>
                <input type="submit" value="Submit">
            </form>
        </section>

        <!--VIDEO-->
        <section id="video">
            <h2>My Favorite Pet Video</h2>

            <iframe width="560" height="315"
        src="https://www.youtube.com/embed/iq79hnuTjvc" 
        title="Pet Video" 
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media;
        gyroscope; picture-in-picture web-share"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen></iframe>
        </section>

        <!--FOOTER-->
        <footer>
            <p>My One-Page Website &copy; 2026</p>
        </footer>
    </body>
</html>
