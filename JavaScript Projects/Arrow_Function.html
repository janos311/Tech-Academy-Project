<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Arrow Function Challenge</title>
</head>

<body>

    <p id="demo"></p>

    <script>
        var myFunction = () => "This is my function";
        

        document.getElementById("demo").innerHTML = myFunction();
    </script>

</body>

</html>
