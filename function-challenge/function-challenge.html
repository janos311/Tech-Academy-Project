
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Function Challenge</title>
</head>
<body>
    <h1>Function Challenge</h1>

    <p id="result">Click the button to see the result.</p>

    <button onclick="myFunction()">Click Here!</button>

    <script>
        // Create a function.
        function myFunction() {
            // Find the paragraph and change its text.
            document.getElementById("result").innerHTML =
                "My JavaScript function works!";
        }
    </script>
</body>
</html>
